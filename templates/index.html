<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cwh868 彩票专用</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260421b">
</head>

<body>
    <div class="container sidebar-collapsed">
        <header class="top-bar">
            <h1 class="title">cwh868 彩票专用 · 排列五分析台</h1>
            <div class="top-actions" style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
                <p class="top-subtitle" style="margin: 0;">数据加载、遗漏分析、矩阵追踪一体化工作台</p>
                <a href="/help" target="_blank" style="color: var(--accent); font-size: 0.82rem; font-weight: 600; text-decoration: none; white-space: nowrap; opacity: 0.8; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.8'">📖 功能说明</a>
            </div>
        </header>

        <div class="analysis-overview">
            <!-- 左侧边缘小巧悬浮折叠按钮 (提拔至此以防结构遮盖) -->
            <button id="sidebarEdgeToggle" class="sidebar-edge-toggle" type="button" title="点击展开/收起左侧数据面板">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>

            <!-- Quick Actions -->
            <section class="data-card">
                <!-- Top Row: Latest Results -->
                <div id="latestResultBanner" class="latest-result-banner" style="display: none;">
                    <div class="banner-header">
                        <div class="banner-left">
                            <span class="banner-title">最新开奖</span>
                            <span id="bannerDate" class="banner-date"></span>
                        </div>
                    </div>
                    <div id="latestNumbersDisplay" class="banner-numbers"></div>
                </div>

                <!-- Bottom Row: Controls -->
                <div class="data-controls-row">
                    <div class="limit-setting-group">
                        <label for="limitInput" class="limit-label">期数</label>
                        <select id="limitInput" class="limit-input select-small">
                            <option value="100">100</option>
                            <option value="200">200</option>
                            <option value="300" selected>300</option>
                            <option value="400">400</option>
                            <option value="500">500</option>
                            <option value="600">600</option>
                            <option value="700">700</option>
                            <option value="800">800</option>
                            <option value="900">900</option>
                            <option value="1000">1000</option>
                        </select>
                    </div>
                    <div class="action-buttons-group">
                        <button id="fetchNetBtn" class="analyze-btn" title="从服务器获取最新开奖并分析">更新开奖</button>
                    </div>
                </div>
            </section>

            <!-- Period Sum Controls (Dynamic) -->
            <section class="period-sum-section" id="periodSumSection">
                <div class="period-sum-header"
                    style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 class="period-sum-title">当前分析维度 <span id="currentPeriodLabel" class="current-period-label">1
                            期</span></h3>
                    <div class="period-sum-header-actions">
                        <label class="retreat-toggle" title="开启后屏蔽最新一期数据">
                            <input type="checkbox" id="retreatToggle">
                            <span class="retreat-slider"></span>
                            <span class="retreat-label">倒退</span>
                        </label>
                        <button id="openMatrixBtn" class="analyze-btn" title="打开全屏矩阵展示">展示矩阵</button>
                    </div>
                </div>
                <div class="period-sum-controls" id="periodSumControls">
                    <!-- Buttons will be generated by JS -->
                </div>
            </section>
        </div>
        <div id="errorMsg" class="error-msg"></div>

        <!-- Two Column: Left = Data Preview, Right = Results -->
        <div class="content-layout">
            <div class="panel data-panel">
                <h3>📄 数据预览</h3>
                <div id="inputDisplay" class="data-display">
                    <p class="empty-hint">加载数据后在此处预览</p>
                </div>
            </div>
            <div class="panel result-panel" id="resultSection">
                <h3>📊 统计结果</h3>
                <div id="statsDisplay" class="stats-display">
                    <p class="empty-hint">点击「更新开奖」查看结果</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧悬浮备选面板 -->
    <div id="candidatePanel" class="candidate-panel collapsed">
        <button id="candidateToggleTab" class="candidate-toggle-tab" type="button">
            <span class="candidate-toggle-icon">📋</span>
            <span id="candidateBadge" class="candidate-badge" style="display:none;">0</span>
        </button>
        <div class="candidate-panel-inner">
            <div class="candidate-panel-header">
                <h3>备选池</h3>
                <button id="candidateClearAllBtn" class="candidate-clear-btn" type="button">清空全部</button>
            </div>
            <div id="candidateList" class="candidate-list">
                <p class="empty-hint">暂无备选项</p>
            </div>
            <div class="candidate-actions">
                <button id="candidateIntersectBtn" class="candidate-intersect-btn" type="button" disabled>求交集</button>
            </div>
        </div>
    </div>

    <!-- 交集结果弹窗 -->
    <div id="intersectionModal" class="intersection-modal" style="display:none;">
        <div class="intersection-backdrop"></div>
        <div class="intersection-dialog">
            <div class="intersection-dialog-header">
                <h3>交集结果</h3>
                <button id="intersectionCloseBtn" class="intersection-close-btn" type="button">✕</button>
            </div>
            <div class="intersection-dialog-body">
                <div class="error-settings" style="margin-bottom:12px;">
                    <span class="error-settings-title" id="intersectionSettingsTitle">容错条件（共 0 项备选）</span>
                    <div class="error-controls">
                        <div class="error-input-group">
                            <label>容错下限:</label>
                            <div class="custom-select" id="intersectionErrMin">
                                <div class="custom-select-trigger"><span>0</span><i class="arrow"></i></div>
                                <div class="custom-select-options"></div>
                            </div>
                        </div>
                        <div class="error-input-group">
                            <label>容错上限:</label>
                            <div class="custom-select" id="intersectionErrMax">
                                <div class="custom-select-trigger"><span>0</span><i class="arrow"></i></div>
                                <div class="custom-select-options"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="intersection-info">
                    <span>符合条件的号码: <strong id="intersectionCountLabel">0</strong> 注</span>
                </div>
                <div class="result-action-group" style="margin-bottom:12px;">
                    <button id="intersectionCopyBtn" class="copy-btn-mini">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                        一键复制结果
                    </button>
                    <button id="intersectionDownloadBtn" class="copy-btn-mini download-btn-mini">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v12m0 0l4-4m-4 4l-4-4M5 21h14"></path></svg>
                        下载TXT
                    </button>
                </div>
                <div id="intersectionRetreatVerify"></div>
                <div id="intersectionResultArea" class="error-grid"></div>
            </div>
        </div>
    </div>

    <div id="matrixOverlay" class="matrix-overlay" aria-hidden="true">
        <section class="matrix-shell" role="dialog" aria-modal="true" aria-label="开奖号码全屏矩阵">
            <header class="matrix-topbar">
                <div class="matrix-topbar-main">
                    <div id="matrixPosControls" class="matrix-pos-controls matrix-pos-controls-top">
                        <button class="matrix-pos-btn" data-pos="1" type="button">1 位</button>
                        <button class="matrix-pos-btn" data-pos="2" type="button">2 位</button>
                        <button class="matrix-pos-btn" data-pos="3" type="button">3 位</button>
                        <button class="matrix-pos-btn" data-pos="4" type="button">4 位</button>
                        <button class="matrix-pos-btn" data-pos="5" type="button">5 位</button>
                    </div>
                    <button id="matrixTopbarToggleBtn" class="matrix-toggle-match-btn matrix-topbar-toggle-btn"
                        type="button" aria-controls="matrixTopbarTools" aria-expanded="false">工具栏</button>
                    <button id="closeMatrixBtn" class="matrix-close-btn" type="button">退出</button>
                </div>
                <div id="matrixTopbarTools" class="matrix-topbar-tools" aria-hidden="true">
                    <div class="matrix-search-control">
                        <input id="matrixSearchInput" class="matrix-search-input" type="text" inputmode="numeric"
                            maxlength="24" aria-label="搜索数字">
                        <button id="matrixSearchBtn" class="matrix-search-btn" type="button">搜索</button>
                        <button id="matrixClearSearchBtn" class="matrix-search-clear-btn" type="button">清除</button>
                    </div>
                    <div class="matrix-topbar-actions">
                        <div id="matrixSourceModeControl" class="matrix-size-control matrix-limit-control" role="group"
                            aria-label="矩阵取号模式">
                            <button id="matrixSourceModeToggleBtn" class="matrix-size-toggle-btn" type="button"
                                aria-haspopup="true" aria-expanded="false">正常</button>
                            <div class="matrix-size-options">
                                <button class="matrix-size-btn active" data-mode="normal" type="button">正常</button>
                                <button class="matrix-size-btn" data-mode="skip1" type="button">隔 1 期</button>
                                <button class="matrix-size-btn" data-mode="skip2" type="button">隔 2 期</button>
                                <button class="matrix-size-btn" data-mode="skip3" type="button">隔 3 期</button>
                                <button class="matrix-size-btn" data-mode="skip4" type="button">隔 4 期</button>
                                <button class="matrix-size-btn" data-mode="skip5" type="button">隔 5 期</button>
                                <button class="matrix-size-btn" data-mode="skip6" type="button">隔 6 期</button>
                                <button class="matrix-size-btn" data-mode="mod5" type="button">模 5</button>
                            </div>
                            <select id="matrixSourceModeInput" class="matrix-limit-input" hidden>
                                <option value="normal" selected>正常</option>
                                <option value="skip1">隔 1 期</option>
                                <option value="skip2">隔 2 期</option>
                                <option value="skip3">隔 3 期</option>
                                <option value="skip4">隔 4 期</option>
                                <option value="skip5">隔 5 期</option>
                                <option value="skip6">隔 6 期</option>
                                <option value="mod5">模 5</option>
                            </select>
                        </div>
                        <div id="matrixLimitControl" class="matrix-size-control matrix-limit-control" role="group"
                            aria-label="期数选择">
                            <button id="matrixLimitToggleBtn" class="matrix-size-toggle-btn" type="button"
                                aria-haspopup="true" aria-expanded="false">期数 300</button>
                            <div class="matrix-size-options">
                                <button class="matrix-size-btn" data-limit="100" type="button">100</button>
                                <button class="matrix-size-btn" data-limit="200" type="button">200</button>
                                <button class="matrix-size-btn active" data-limit="300" type="button">300</button>
                                <button class="matrix-size-btn" data-limit="400" type="button">400</button>
                                <button class="matrix-size-btn" data-limit="500" type="button">500</button>
                                <button class="matrix-size-btn" data-limit="600" type="button">600</button>
                                <button class="matrix-size-btn" data-limit="700" type="button">700</button>
                                <button class="matrix-size-btn" data-limit="800" type="button">800</button>
                                <button class="matrix-size-btn" data-limit="900" type="button">900</button>
                                <button class="matrix-size-btn" data-limit="1000" type="button">1000</button>
                            </div>
                            <select id="matrixLimitInput" class="matrix-limit-input" hidden>
                                <option value="100">100</option>
                                <option value="200">200</option>
                                <option value="300" selected>300</option>
                                <option value="400">400</option>
                                <option value="500">500</option>
                                <option value="600">600</option>
                                <option value="700">700</option>
                                <option value="800">800</option>
                                <option value="900">900</option>
                                <option value="1000">1000</option>
                            </select>
                        </div>
                        <button id="matrixToggleRowIdsBtn" class="matrix-toggle-match-btn" type="button"
                            aria-pressed="false">显示期号</button>
                        <button id="matrixToggleMatchBtn" class="matrix-toggle-match-btn" type="button">显示命中</button>
                        <div id="matrixSizeControl" class="matrix-size-control" role="group" aria-label="单元格大小">
                            <button id="matrixSizeToggleBtn" class="matrix-size-toggle-btn" type="button"
                                aria-haspopup="true" aria-expanded="false">单元格 20</button>
                            <div class="matrix-size-options">
                                <button class="matrix-size-btn" data-size="16" type="button">16</button>
                                <button class="matrix-size-btn" data-size="18" type="button">18</button>
                                <button class="matrix-size-btn active" data-size="20" type="button">20</button>
                                <button class="matrix-size-btn" data-size="24" type="button">24</button>
                                <button class="matrix-size-btn" data-size="30" type="button">30</button>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="matrix-toolbar">
                <div id="matrixComboInfo" class="matrix-combo-info"></div>
            </div>

            <div class="matrix-content">
                <aside id="matrixMatchPanel" class="matrix-match-panel">
                    <h3>下一位统计</h3>
                    <div id="matrixNextStats" class="matrix-next-stats"></div>
                </aside>
                <div class="matrix-table-panel">
                    <div id="matrixTableWrap" class="matrix-table-wrap"></div>
                </div>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='dadi_error_utils.js') }}?v=20260518a"></script>
    <script src="{{ url_for('static', filename='candidate_panel_utils.js') }}?v=20260518a"></script>
    <script src="{{ url_for('static', filename='script.js') }}?v=20260518b"></script>
</body>

</html>
